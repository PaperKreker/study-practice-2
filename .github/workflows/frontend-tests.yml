name: Frontend Tests

on: push

permissions:
  contents: read

defaults:
  run:
    working-directory: ./frontend

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Node
      uses: actions/setup-node@v6

      with:
        node-version: 24
    - name: Install dependencies
      run: |
        npm ci
    - name: Test
      run: |
        npm run build --if-present
        npm test -- --watchAll=false --coverage
